<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebCAPA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>WebCAPA</h1>
      <p class="line-break-css">
        Still under development
        Powered by pycapa
        Currently supports Assignment 1 (excluding question 3)
      </p>
    </div>

    <div class="card">
      <label for="algorithm">Select Problem</label>
      <select id="algorithm"></select>

      <label for="textInput">Question Text</label>
      <textarea
        id="textInput"
        placeholder="Copy-Paste the question here . . ."></textarea>

      <button id="run">Calculate</button>
    </div>

    <div class="card output-card">
      <h2>Result</h2>
      <pre id="output" class="output"></pre>
    </div>

    <div class="card debug-card">
      <h2>Debug Info</h2>
      <pre id="debug" class="output"></pre>
    </div>

    <div class="card history-card">
      <h2>History</h2>
      <pre id="history" class="output"></pre>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
