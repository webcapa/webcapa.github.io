<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics Solver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Fancy Calculator</h1>
      <p>Still in development</p>
    </div>

    <div class="card">
      <label for="algorithm">Select Problem</label>
      <select id="algorithm"></select>

      <label for="textInput">Question Text</label>
      <textarea
        id="textInput"
        placeholder="Copy-Paste the question here . . ."></textarea>

      <button id="run">Magic</button>
    </div>

    <div class="card output-card">
      <h2>Result</h2>
      <pre id="output" class="output"></pre>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
